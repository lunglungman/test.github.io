name: 更新股票儀表板資料

on:
  schedule:
    - cron: "47 7 * * 1-5"    # 台北 15:47：股價、估值、三大法人
    - cron: "47 13 * * 1-5"   # 台北 21:47：補融資融券（證交所晚上公布）
  workflow_dispatch:
  push:
    paths:
      - scripts/dashboard/**
      - dashboard/watchlist.json
      - .github/workflows/dashboard-data.yml

permissions:
  contents: write

concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓證交所盤後資料
        run: python scripts/dashboard/build_data.py

      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "更新股票儀表板資料"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
