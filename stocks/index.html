<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f3a5f">
    <title>台股盯盤</title>
    <style>
        :root {
            --bg: #f3f5f8; --surface: #fff; --surface-2: #edf0f4; --border: #dce1e8;
            --text: #1b2430; --muted: #657084; --primary: #1f5fa8;
            --up: #d1382b; --up-soft: #fdebe9; --down: #138a4c; --down-soft: #e4f4ea; --flat: #657084;
            --warn-bg: #fff4dc; --warn: #8a5a00;
            --shadow: 0 1px 2px rgba(20,30,50,.06), 0 6px 20px rgba(20,30,50,.07);
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #10141a; --surface: #171d25; --surface-2: #1f2731; --border: #2b3542;
                --text: #e6ebf2; --muted: #93a0b3; --primary: #6ea8ec;
                --up: #ff6b5e; --up-soft: #3a1d1b; --down: #3fc47c; --down-soft: #15301f; --flat: #93a0b3;
                --warn-bg: #3a2e14; --warn: #f2c14e;
                --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.5;
        }
        .num { font-variant-numeric: tabular-nums; }
        .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }

        .topbar {
            position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
            height: 56px; padding: 0 14px;
            background: color-mix(in srgb, var(--surface) 90%, transparent);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .back { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; color: var(--muted); text-decoration: none; }
        .back:hover { background: var(--surface-2); color: var(--text); }
        .topbar b { flex: 1; }
        .status { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--flat); }
        .status.live .dot { background: var(--up); animation: pulse 1.6s infinite; }
        @keyframes pulse { 50% { opacity: .3; } }

        main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
        .notice { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: .9rem; }
        h2 { font-size: 1.05rem; margin: 26px 0 12px; display: flex; align-items: baseline; gap: 10px; }
        h2 small { font-weight: 400; color: var(--muted); font-size: .8rem; }

        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px;
            transition: box-shadow .15s;
        }
        .card:hover { box-shadow: var(--shadow); }
        .card.c-up { border-top: 3px solid var(--up); } .card.c-down { border-top: 3px solid var(--down); }
        .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .card-name { font-weight: 700; }
        .card-sym { font-size: .78rem; color: var(--muted); }
        .price { font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
        .chg { font-size: .92rem; font-weight: 600; }
        .tag { font-size: .7rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #fff; margin-left: 6px; vertical-align: middle; }
        .tag.lu { background: var(--up); } .tag.ld { background: var(--down); } .tag.trial { background: var(--flat); }
        .ohlc { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: .78rem; color: var(--muted); }
        .ohlc b { color: var(--text); font-weight: 600; }
        .book { margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 8px; font-size: .78rem; }
        .book-head { display: flex; justify-content: space-between; color: var(--muted); font-size: .72rem; margin-bottom: 4px; }
        .book-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; }
        .book-grid .h { color: var(--muted); font-weight: 600; font-size: .72rem; display: flex; justify-content: space-between; padding: 0 4px; }
        .lv { position: relative; display: flex; justify-content: space-between; align-items: center; height: 20px; padding: 0 4px; border-radius: 4px; overflow: hidden; }
        .lv i { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; opacity: .22; transition: width .4s ease; }
        .lv.bid i { right: 0; background: var(--up); }
        .lv.ask i { left: 0; background: var(--down); }
        .lv span { position: relative; }
        .lv .p { font-weight: 600; }
        .lv.bid .p { color: var(--up); } .lv.ask .p { color: var(--down); }
        .ratio { margin-top: 8px; }
        .ratio-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
        .ratio-bar .b { background: var(--up); transition: width .4s ease; }
        .ratio-bar .a { background: var(--down); transition: width .4s ease; }
        .ratio-label { display: flex; justify-content: space-between; font-size: .72rem; margin-top: 3px; font-weight: 600; }
        .ratio-label .b { color: var(--up); } .ratio-label .a { color: var(--down); }
        .book-empty { color: var(--muted); font-size: .75rem; padding: 6px 0; text-align: center; }
        .flash-up { animation: fu 1s; } .flash-down { animation: fd 1s; }
        @keyframes fu { from { background: var(--up-soft); } }
        @keyframes fd { from { background: var(--down-soft); } }

        table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
        th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--border); font-size: .92rem; }
        th { font-size: .78rem; color: var(--muted); font-weight: 600; background: var(--surface-2); }
        th:first-child, td:first-child { text-align: left; }
        tr:last-child td { border-bottom: 0; }
        td .sym { color: var(--muted); font-size: .78rem; margin-left: 6px; }
        td a { color: var(--primary); text-decoration: none; font-size: .82rem; }
        .est { font-size: .7rem; color: var(--muted); }
        .hide-sm { }

        footer { margin-top: 36px; font-size: .8rem; color: var(--muted); text-align: center; line-height: 1.8; }
        @media (max-width: 560px) {
            .cards { grid-template-columns: 1fr; gap: 10px; }
            .price { font-size: 1.5rem; }
            th, td { padding: 9px 8px; font-size: .86rem; }
            .hide-sm { display: none; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="back" href="../" aria-label="回入口首頁" title="回入口首頁">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <b>台股盯盤</b>
        <span class="status" id="status"><span class="dot"></span><span id="statusText">連線中…</span></span>
    </header>
    <main>
        <p class="notice" id="notice" hidden></p>

        <h2>主要盯盤 <small id="rtInfo"></small></h2>
        <div class="cards" id="cards"></div>

        <h2>其他股票 <small id="otInfo"></small></h2>
        <table>
            <thead><tr><th>股票</th><th>成交</th><th>漲跌</th><th>漲跌幅</th><th class="hide-sm">成交量</th><th class="hide-sm"></th></tr></thead>
            <tbody id="rows"></tbody>
        </table>

        <footer>
            主要盯盤：富果行情 API，成交價約每 7 秒、零股五檔約每 30 秒更新；其他股票：證交所，約每 30 秒更新。<br>
            零股五檔固定展開。資料僅供參考，下單請以券商報價為準。
        </footer>
    </main>
    <script>
    (() => {
        const API = 'https://stock-proxy.jefflung0501.workers.dev';
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmt = (n, d = 2) => n == null ? '—' : Number(n).toLocaleString('zh-TW', { minimumFractionDigits: n % 1 ? d : 0, maximumFractionDigits: d });
        const dir = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
        const sign = n => n > 0 ? '▲' : n < 0 ? '▼' : '';
        const vol = n => n == null ? '—' : n >= 1e4 ? `${(n / 1e4).toFixed(1)} 萬張` : `${fmt(n, 0)} 張`;
        const clock = ts => { const d = new Date(ts); return d.toLocaleTimeString('zh-TW', { hour12: false }); };
        const google = s => `https://www.google.com/search?q=${encodeURIComponent(s + ' 股價')}`;

        const last = {};          // 上一次價格，用來閃爍提示
        let odd = {};                // 零股五檔，依股票代號
        let lastRealtime = [];

        // 零股五檔：量旁邊畫長條（以 10 檔中最大量為 100%），最下面是委買／委賣比例
        function bookHTML(o) {
            if (!o) return '<div class="book-empty">零股五檔載入中…</div>';
            if (o.error) return `<div class="book-empty">零股五檔：${esc(o.error)}</div>`;
            const bids = o.bids || [], asks = o.asks || [];
            if (!bids.length && !asks.length) return '<div class="book-empty">目前沒有零股委託</div>';
            const max = Math.max(1, ...bids.map(x => x.size), ...asks.map(x => x.size));
            const sumB = bids.reduce((t, x) => t + x.size, 0), sumA = asks.reduce((t, x) => t + x.size, 0);
            const pb = sumB + sumA ? Math.round(sumB / (sumB + sumA) * 100) : 50;
            const rows = [];
            for (let i = 0; i < 5; i++) {
                const b = bids[i], a = asks[i];
                rows.push(b ? `<div class="lv bid"><i style="width:${b.size / max * 100}%"></i><span>${fmt(b.size, 0)}</span><span class="p">${fmt(b.price)}</span></div>` : '<div class="lv"></div>');
                rows.push(a ? `<div class="lv ask"><i style="width:${a.size / max * 100}%"></i><span class="p">${fmt(a.price)}</span><span>${fmt(a.size, 0)}</span></div>` : '<div class="lv"></div>');
            }
            return `
                <div class="book-head"><span>零股五檔（單位：股）</span><span>${o.price != null ? `零股成交 ${fmt(o.price)}` : ''}</span></div>
                <div class="book-grid">
                    <div class="h"><span>買量</span><span>買價</span></div><div class="h"><span>賣價</span><span>賣量</span></div>
                    ${rows.join('')}
                </div>
                <div class="ratio" title="五檔委買量 ${fmt(sumB, 0)} 股／委賣量 ${fmt(sumA, 0)} 股">
                    <div class="ratio-bar"><span class="b" style="width:${pb}%"></span><span class="a" style="width:${100 - pb}%"></span></div>
                    <div class="ratio-label"><span class="b">委買 ${pb}%（${fmt(sumB, 0)}）</span><span class="a">（${fmt(sumA, 0)}）${100 - pb}% 委賣</span></div>
                </div>`;
        }

        function renderOddlot(items) {
            odd = Object.fromEntries(items.map(o => [o.symbol, o]));
            renderCards(lastRealtime, true);
        }

        function renderCards(items, bookOnly) {
            if (!bookOnly) lastRealtime = items;
            $('#cards').innerHTML = items.map(q => {
                if (q.error) return `<div class="card"><div class="card-head"><span class="card-name">${esc(q.symbol)}</span></div><span class="card-sym">${esc(q.error)}</span></div>`;
                const d = dir(q.change);
                const flash = !bookOnly && last[q.symbol] != null && q.price !== last[q.symbol] ? (q.price > last[q.symbol] ? 'flash-up' : 'flash-down') : '';
                last[q.symbol] = q.price;
                const book = bookHTML(odd[q.symbol]);
                return `
                <div class="card c-${d} ${flash}" data-sym="${esc(q.symbol)}">
                    <div class="card-head">
                        <span class="card-name">${esc(q.name)}${q.limitUp ? '<span class="tag lu">漲停</span>' : ''}${q.limitDown ? '<span class="tag ld">跌停</span>' : ''}${q.trial ? '<span class="tag trial">試撮</span>' : ''}</span>
                        <span class="card-sym">${esc(q.symbol)}</span>
                    </div>
                    <div class="price num ${d}">${fmt(q.price)}</div>
                    <div class="chg num ${d}">${sign(q.change)} ${fmt(Math.abs(q.change ?? 0))}（${fmt(Math.abs(q.changePercent ?? 0))}%）</div>
                    <div class="ohlc num">
                        <span>開 <b>${fmt(q.open)}</b></span><span>昨收 <b>${fmt(q.prevClose)}</b></span>
                        <span>高 <b>${fmt(q.high)}</b></span><span>低 <b>${fmt(q.low)}</b></span>
                        <span style="grid-column:1/-1">量 <b>${vol(q.volume)}</b></span>
                    </div>
                    <div class="book num">${book}</div>
                </div>`;
            }).join('');
        }

        function renderRows(items) {
            $('#rows').innerHTML = items.map(q => {
                if (q.error) return `<tr><td>${esc(q.symbol)}</td><td colspan="5" class="flat">${esc(q.error)}</td></tr>`;
                const d = dir(q.change);
                return `<tr>
                    <td><b>${esc(q.name)}</b><span class="sym">${esc(q.symbol)}</span></td>
                    <td class="num ${d}">${fmt(q.price)}${q.estimated ? '<div class="est">買價估計</div>' : ''}</td>
                    <td class="num ${d}">${sign(q.change)} ${fmt(Math.abs(q.change ?? 0))}</td>
                    <td class="num ${d}">${fmt(Math.abs(q.changePercent ?? 0))}%</td>
                    <td class="num hide-sm">${vol(q.volume)}</td>
                    <td class="hide-sm"><a href="${google(q.symbol)}" target="_blank" rel="noopener">Google ↗</a></td>
                </tr>`;
            }).join('');
        }

        /* ---- 輪詢：開盤中才頻繁更新，分頁隱藏時暫停，出錯就放慢 ---- */
        function poller(group, render, infoEl) {
            let timer = null, failures = 0;
            async function tick() {
                clearTimeout(timer);
                if (document.hidden) return;   // 回到分頁時再繼續
                let wait;
                try {
                    const r = await fetch(`${API}/${group}`, { cache: 'no-store' });
                    const data = await r.json();
                    if (!r.ok || !data.items) throw new Error(data.error || r.status);
                    render(data.items);
                    failures = 0;
                    setMarket(data.marketOpen);
                    infoEl.textContent = `${clock(data.updated)} 更新${data.stale ? '（暫用舊資料）' : ''}`;
                    showNotice(group, data.stale ? `資料來源暫時有問題，先顯示 ${clock(data.updated)} 的資料。` : '');
                    wait = Math.max(5, data.ttl || 30) * 1000;
                } catch (e) {
                    failures++;
                    wait = Math.min(120, 10 * 2 ** (failures - 1)) * 1000;   // 10、20、40、80、120 秒
                    showNotice(group, `${{ realtime: '主要盯盤', oddlot: '零股五檔', others: '其他股票' }[group]}更新失敗（${e.message}），${wait / 1000} 秒後重試。`);
                }
                timer = setTimeout(tick, wait);
            }
            document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
            return tick;
        }

        const notices = {};
        function showNotice(group, text) {
            notices[group] = text;
            const msg = Object.values(notices).filter(Boolean).join(' ');
            $('#notice').hidden = !msg;
            $('#notice').textContent = msg;
        }
        function setMarket(open) {
            $('#status').classList.toggle('live', !!open);
            $('#statusText').textContent = open ? '盤中即時' : '已收盤';
        }


        poller('realtime', renderCards, $('#rtInfo'))();
        poller('others', renderRows, $('#otInfo'))();
        poller('oddlot', renderOddlot, { set textContent(v) { } })();
    })();
    </script>
</body>
</html>
