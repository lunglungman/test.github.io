<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2f6f73">
    <title>我的工具箱</title>
    <style>
        :root {
            --bg: #f4f6f5; --surface: #fff; --surface-2: #eef2f1; --border: #dbe2e0;
            --text: #1d2a2c; --muted: #63716f; --primary: #2f6f73; --primary-soft: #e1efef;
            --accent: #b4532a; --accent-soft: #f8e9e1; --blue: #1f5fa8; --blue-soft: #e3edf9;
            --shadow: 0 1px 2px rgba(20,40,40,.06), 0 8px 24px rgba(20,40,40,.08);
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111716; --surface: #182120; --surface-2: #1f2a29; --border: #2c3a38;
                --text: #e4ecea; --muted: #92a19e; --primary: #5fb3b3; --primary-soft: #1c3434;
                --accent: #e58e62; --accent-soft: #3a2519; --blue: #6ea8ec; --blue-soft: #1a2a3d;
                --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.6;
        }
        main { max-width: 880px; margin: 0 auto; padding: 72px 20px 48px; }
        h1 { margin: 0; font-size: 2.1rem; letter-spacing: .02em; }
        .sub { margin: 6px 0 36px; color: var(--muted); }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .card {
            display: flex; flex-direction: column; gap: 14px; padding: 24px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
            color: inherit; text-decoration: none;
            transition: transform .15s, box-shadow .15s, border-color .15s;
        }
        @media (hover: hover) {
            .card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--c); }
        }
        .card:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
        .icon {
            display: grid; place-items: center; width: 52px; height: 52px; border-radius: 14px;
            background: var(--c-soft); color: var(--c);
        }
        .card h2 { margin: 0; font-size: 1.25rem; }
        .card p { margin: 4px 0 0; color: var(--muted); font-size: .92rem; }
        .meta { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--muted); }
        .go { font-weight: 600; color: var(--c); }
        .quiz { --c: var(--primary); --c-soft: var(--primary-soft); }
        .lativ { --c: var(--accent); --c-soft: var(--accent-soft); }
        .stocks { --c: var(--blue); --c-soft: var(--blue-soft); }
        footer { margin-top: 48px; text-align: center; font-size: .8rem; color: var(--muted); }
        @media (max-width: 560px) {
            main { padding: 40px 16px 32px; }
            h1 { font-size: 1.7rem; }
            .sub { margin-bottom: 24px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <h1>我的工具箱</h1>
        <p class="sub">選一個開始吧。</p>
        <div class="grid">
            <a class="card lativ" href="lativ/">
                <div class="icon">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3c-1 2-2.5 3-4 3S9 5 8 3z"/></svg>
                </div>
                <div>
                    <h2>LATIV 純棉男裝</h2>
                    <p>自動整理材質 100% 棉、M 號有貨的男裝，每 3 小時更新。</p>
                </div>
                <div class="meta"><span id="lativMeta">&nbsp;</span><span class="go">進入 →</span></div>
            </a>
            <a class="card stocks" href="stocks/">
                <div class="icon">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
                </div>
                <div>
                    <h2>台股盯盤</h2>
                    <p>主要 5 檔即時報價與五檔，其他股票每 30 秒更新。</p>
                </div>
                <div class="meta"><span>盤中即時</span><span class="go">進入 →</span></div>
            </a>
            <a class="card quiz" href="quiz/">
                <div class="icon">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="2"/></svg>
                </div>
                <div>
                    <h2>生物單元測驗</h2>
                    <p>62 個單元題庫，考試與練習模式、錯題本、綜合隨機測驗。</p>
                </div>
                <div class="meta"><span id="quizMeta">&nbsp;</span><span class="go">進入 →</span></div>
            </a>
        </div>
        <footer>lunglungman.github.io</footer>
    </main>
    <script>
        (async () => {
            try {
                const d = await (await fetch('lativ/data.json', { cache: 'no-cache' })).json();
                const t = new Date(d.updated);
                document.getElementById('lativMeta').textContent =
                    `${d.count} 件 · ${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} 更新`;
            } catch { /* 尚未有資料 */ }
            try {
                const h = JSON.parse(localStorage.getItem('bioquiz.history') || '{}');
                const n = Object.keys(h).length;
                document.getElementById('quizMeta').textContent = n ? `已完成 ${n} 個單元` : '62 個單元';
            } catch { /* ignore */ }
        })();
    </script>
</body>
</html>
